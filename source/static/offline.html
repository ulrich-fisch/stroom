<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#070c18">
  <title>Aflyn - Stroom</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 45% at 50% 30%,rgba(29,78,216,.3),rgba(7,12,24,0) 70%),#070c18;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 8px}
    .brand b{font-family:Sora,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:.16em;font-size:24px;color:#fff}
    h2{font-family:Sora,Inter,system-ui,sans-serif;font-size:22px;margin:8px 0;color:#fff}
    p{color:#94a3b8;font-size:14px;line-height:1.6;max-width:300px;margin:0 auto 20px}
    button{background:linear-gradient(135deg,#7dd3fc,#60a5fa);color:#04101f;border:0;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;cursor:pointer}
    small{display:block;margin-top:12px;color:#6f81a3;font-size:12px}
    .st{position:relative;width:200px;height:150px;margin:0 auto}
    .fish{position:absolute;left:20px;bottom:22px;width:160px;height:95px;transform-origin:50% 90%;animation:flop 2.4s ease-in-out infinite}
    .sh{position:absolute;left:0;bottom:4px;animation:shd 2.4s ease-in-out infinite}
    .gr{position:absolute;left:0;bottom:0}
    .bl{position:absolute;right:10px;top:0;font:600 12px Sora,Inter,sans-serif;color:#bae6fd;background:#0c1528;border:1px solid #2a3d66;border-radius:999px;padding:4px 12px;animation:blub 2.4s ease infinite}
    @keyframes flop{0%,60%,100%{transform:translateY(0) rotate(0)}6%{transform:translateY(-30px) rotate(-26deg)}14%{transform:translateY(0) rotate(14deg)}22%{transform:translateY(-14px) rotate(24deg)}30%{transform:translateY(0) rotate(-10deg)}38%{transform:translateY(-6px) rotate(8deg)}46%{transform:translateY(0) rotate(-3deg)}}
    @keyframes shd{0%,60%,100%{transform:scaleX(1);opacity:.5}6%{transform:scaleX(.6);opacity:.25}22%{transform:scaleX(.75);opacity:.3}}
    @keyframes blub{0%,8%{opacity:0;transform:translateY(4px)}14%,50%{opacity:1;transform:none}60%,100%{opacity:0}}
    @keyframes wf{from{transform:translateX(0)}to{transform:translateX(56px)}}
    .w1{animation:wf 2.6s linear infinite}.w2{animation:wf 3.4s linear infinite;animation-delay:-1.1s}.w3{animation:wf 4.2s linear infinite;animation-delay:-2.3s}
    @media (prefers-reduced-motion:reduce){.fish,.sh,.bl,.w1,.w2,.w3{animation:none}.bl{opacity:1}}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs><clipPath id="c"><path d="M16 13 Q16 8 20.3 10.5 L52.7 29.5 Q57 32 52.7 34.5 L20.3 53.5 Q16 56 16 51 Z"/></clipPath>
        <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="14" y1="8" x2="58" y2="56"><stop offset="0" stop-color="#bae6fd"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
        <g clip-path="url(#c)" stroke="url(#g)" stroke-width="7">
          <path class="w1" d="M-48 21 c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0"/><path class="w2" opacity=".75" d="M-48 34 c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0"/><path class="w3" opacity=".5" d="M-48 47 c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0c10 -10 20 -10 28 0 s18 10 28 0"/>
        </g>
      </svg>
      <b>STROOM</b>
    </div>
    <div class="st">
      <span class="bl">blub… blub…</span>
      <div class="fish"><svg width="160" height="95" viewBox="-32 -16 54 32" aria-hidden="true"><g transform="scale(1.15)">
        <path d="M-13 0 C-7 -9 8 -9 15 0 C8 9 -7 9 -13 0 Z" fill="#38bdf8"/><path d="M-12 0 L-24 -8 L-20 0 L-24 8 Z" fill="#0ea5e9"/>
        <path d="M-2 -6 L2 -12 L6 -6 Z" fill="#0ea5e9"/><path d="M-8 1 C-2 5 6 5 12 1 C6 7 -2 7 -8 1 Z" fill="#e0f2fe" opacity=".85"/>
        <circle cx="9" cy="-1.6" r="1.8" fill="#02030b"/><path d="M14 1.5 Q15.5 2.5 14 3.5" stroke="#02030b" stroke-width=".8" fill="none" stroke-linecap="round"/></g></svg></div>
      <svg class="sh" width="200" height="14" viewBox="0 0 200 14" aria-hidden="true"><ellipse cx="100" cy="7" rx="62" ry="5" fill="#02030b"/></svg>
      <svg class="gr" width="200" height="6" viewBox="0 0 200 6" fill="none" aria-hidden="true"><path d="M0 3 H200" stroke="#2a3d66" stroke-width="2" stroke-dasharray="10 6" stroke-linecap="round"/></svg>
    </div>
    <h2>Jy is aflyn</h2>
    <p>Ons vis spartel hier op die droë grond. Kyk jou data of Wi-Fi na en probeer weer.</p>
    <button onclick="location.reload()">Probeer weer</button>
    <small>Hy kan nie lank sonder water nie.</small>
  </main>
</body>
</html>
