<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/stroom.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6 selection:bg-sky-500 selection:text-slate-950">

  <div class="max-w-4xl w-full text-center space-y-10">
    <div class="space-y-2">
      <span class="text-xs text-sky-400 font-mono uppercase tracking-widest">Stroom</span>
      <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight uppercase">Wie kyk tans?</h1>
      <p class="text-xs sm:text-sm text-slate-400 font-normal">Kies jou profiel om toegang tot jou berekende lys en voorkeure te kry.</p>
    </div>

    <!-- Profiles Grid -->
    <div id="profileGrid" class="flex flex-wrap justify-center gap-6 sm:gap-10 pt-4"></div>
    <p id="profErr" class="text-xs text-rose-400 min-h-[1rem]"></p>

    <!-- Edit panel -->
    <div id="editPanel" class="hidden max-w-sm mx-auto bg-slate-900/80 border border-slate-800 rounded-2xl p-5 text-left space-y-4">
      <h2 id="editTitle" class="text-sm font-bold text-white uppercase tracking-wider">Profiel</h2>
      <input id="edName" maxlength="20" placeholder="Naam" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
      <div id="edAvatars" class="flex flex-wrap gap-2"></div>
      <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer"><input id="edKids" type="checkbox" class="accent-sky-500"><span>Kinderprofiel (slegs titels geskik vir kinders)</span></label>
      <div class="flex items-center space-x-2">
        <button onclick="saveEdit()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs uppercase tracking-wider px-4 py-2 rounded-full transition">Stoor</button>
        <button onclick="closeEdit()" class="border border-slate-700 text-slate-300 text-xs uppercase tracking-wider px-4 py-2 rounded-full">Kanselleer</button>
        <button id="edDel" onclick="delEdit()" class="ml-auto text-rose-400 hover:text-rose-300 text-xs uppercase tracking-wider">Skrap</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="pt-8 flex justify-center items-center space-x-4">
      <button id="manageBtn" onclick="toggleManage()" class="inline-block border border-slate-700 hover:border-white text-slate-300 hover:text-white px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Bestuur Profiele</button>
      <a href="katalogus.html" class="inline-block border border-slate-700 hover:border-white text-slate-300 hover:text-white px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">
        Gaan na Katalogus
      </a>
      <a href="rekening.html" class="inline-block bg-slate-900 border border-slate-800 hover:border-slate-700 text-sky-400 px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">
        Bestuur Rekening
      </a>
    </div>
  </div>

  

<script src="/app.js"></script>
<script>
    var manage = false, editing = null, edAvatar = 0;
    function draw() {
      var g = document.getElementById('profileGrid');
      var html = profiles.map(function (p) {
        return '<div onclick="' + (manage ? 'openEdit(' + p.id + ')' : 'selectProfile(' + p.id + ')') + '" class="cursor-pointer group space-y-3 w-28 sm:w-36">' +
          '<div class="relative aspect-square rounded-2xl border-2 ' + (manage ? 'border-sky-400' : 'border-transparent group-hover:border-white') + ' transition shadow-2xl flex items-center justify-center text-5xl font-black text-white" style="background:' + avatarBg(p.avatar) + '">' + escHtml(p.naam.charAt(0).toUpperCase()) +
          (manage ? '<span class="absolute bottom-1 right-2 text-[10px] font-bold uppercase bg-slate-950/70 rounded px-1.5 py-0.5">Wysig</span>' : '') + '</div>' +
          '<span class="block text-xs sm:text-sm text-slate-400 group-hover:text-white transition font-bold uppercase tracking-wider">' + escHtml(p.naam) + '</span>' +
          (p.kinders ? '<span class="block text-[9px] text-amber-300 uppercase tracking-widest">Kinders</span>' : '') + '</div>';
      }).join('');
      if (profiles.length < maxProfiles) html += '<div onclick="openEdit(0)" class="cursor-pointer group space-y-3 w-28 sm:w-36"><div class="aspect-square rounded-2xl border-2 border-dashed border-slate-700 group-hover:border-white transition flex items-center justify-center text-4xl text-slate-500 group-hover:text-white">+</div><span class="block text-xs sm:text-sm text-slate-500 font-bold uppercase tracking-wider">Nuwe profiel</span></div>';
      g.innerHTML = html;
      document.getElementById('manageBtn').textContent = manage ? 'Klaar' : 'Bestuur Profiele';
    }
    function selectProfile(id) {
      var p = profiles.find(function (x) { return x.id === id; });
      if (p) setActiveProfile(p);
      window.location.href = 'katalogus.html';
    }
    function toggleManage() { manage = !manage; closeEdit(); draw(); }
    function pickAvatar(i) {
      edAvatar = i;
      document.getElementById('edAvatars').innerHTML = AVATARS.map(function (_, k) {
        return '<button onclick="pickAvatar(' + k + ')" class="w-9 h-9 rounded-lg border-2 ' + (k === edAvatar ? 'border-white' : 'border-transparent') + '" style="background:' + avatarBg(k) + '"></button>';
      }).join('');
    }
    function openEdit(id) {
      editing = id ? profiles.find(function (x) { return x.id === id; }) : null;
      document.getElementById('editTitle').textContent = editing ? 'Wysig profiel' : 'Nuwe profiel';
      document.getElementById('edName').value = editing ? editing.naam : '';
      document.getElementById('edKids').checked = editing ? editing.kinders : false;
      document.getElementById('edDel').style.display = editing && profiles.length > 1 ? '' : 'none';
      pickAvatar(editing ? editing.avatar : profiles.length % AVATARS.length);
      document.getElementById('editPanel').classList.remove('hidden');
    }
    function closeEdit() { document.getElementById('editPanel').classList.add('hidden'); editing = null; }
    async function api(path, body) {
      var r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) { document.getElementById('profErr').textContent = d.fout || 'Iets het skeefgeloop.'; return false; }
      document.getElementById('profErr').textContent = ''; return true;
    }
    async function reload() {
      var r = await fetch('/api/profiele'); var d = await r.json();
      profiles = d.profiele; maxProfiles = d.maks;
      var cur = profiles.find(function (p) { return p.id === activeProfileId; });
      if (cur) setActiveProfile(cur);
      renderHeaderProfiles(); draw();
    }
    async function saveEdit() {
      var body = { naam: document.getElementById('edName').value, avatar: edAvatar, kinders: document.getElementById('edKids').checked };
      var ok = editing ? await api('/api/profiel-wysig', Object.assign({ id: editing.id }, body)) : await api('/api/profiel-nuut', body);
      if (ok) { closeEdit(); await reload(); }
    }
    async function delEdit() {
      if (!editing || !confirm('Skrap hierdie profiel en sy lys?')) return;
      var id = editing.id;
      if (await api('/api/profiel-skrap', { id: id })) {
        if (id === activeProfileId) { activeProfileId = 0; try { localStorage.removeItem('stroom_profiel_id'); } catch (e) {} }
        closeEdit(); await reload();
      }
    }
    profielReady.then(function () { draw(); });
</script>
</body>
</html>
